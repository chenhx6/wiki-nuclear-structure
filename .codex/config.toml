approval_policy = "never"
default_permissions = "wiki_l3"

# [windows]
# sandbox = "unelevated"

[permissions.wiki_l3]
description = "Read and execute outside the Wiki without external writes; full write access inside E:\\imp\\wiki."

[permissions.wiki_l3.filesystem]
":root" = "read"
'E:\imp\wiki' = "write"
'E:\imp\wiki\.codex' = "write"
'E:\imp\wiki\.git' = "write"
'E:\imp\wiki\.agents' = "write"

[permissions.wiki_l3.network]
enabled = true
mode = "full"
allow_upstream_proxy = true
allow_local_binding = true

[permissions.wiki_l3.network.domains]
"*" = "allow"

[shell_environment_policy.set]
TEMP = 'E:\imp\wiki\tmp\codex-runtime'
TMP = 'E:\imp\wiki\tmp\codex-runtime'
TMPDIR = 'E:\imp\wiki\tmp\codex-runtime'
UV_CACHE_DIR = 'E:\imp\wiki\tmp\uv-cache'
PYTHONDONTWRITEBYTECODE = "1"

[mcp_servers.academic-search.env]
TEMP = 'E:\imp\wiki\tmp\codex-runtime'
TMP = 'E:\imp\wiki\tmp\codex-runtime'
TMPDIR = 'E:\imp\wiki\tmp\codex-runtime'
UV_CACHE_DIR = 'E:\imp\wiki\tmp\uv-cache'
